flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/wayout_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFC23D"
  adaptive_icon_foreground: assets/branding/wayout_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFC23D"
  web:
    generate: true
    image_path: assets/branding/wayout_icon.png
    background_color: "#FFC23D"
    theme_color: "#FFC23D"
  windows:
    generate: true
    image_path: assets/branding/wayout_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/wayout_icon.png
